name: Supabase backup

on:
  schedule:
    # 00:30 UTC = 03:30 Türkiye saati (Europe/Istanbul, yıl boyu UTC+3)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create encrypted-source backup files
        shell: bash
        run: |
          set -euo pipefail
          backup_name="backup-$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$RUNNER_TEMP/$backup_name"
          mkdir -p "$backup_dir/storage"
          docker run --rm --volume "$backup_dir:/backup" postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file /backup/database.dump
          BACKUP_STORAGE_DIR="$backup_dir/storage" node scripts/backup-storage.mjs
          (
            cd "$backup_dir"
            sha256sum database.dump > SHA256SUMS
            find storage -type f -print0 | sort -z | xargs -0 -r sha256sum >> SHA256SUMS
          )
          echo "BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"
      - name: Upload private backup
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          : "${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET GitHub Actions secret is unavailable}"
          aws s3 sync "$BACKUP_DIR" "s3://$BACKUP_S3_BUCKET/supabase/$(basename "$BACKUP_DIR")" --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
      - name: Report success
        run: echo "Supabase backup completed at $(date -u +%FT%TZ); retention is enforced by the private bucket lifecycle policy." >> "$GITHUB_STEP_SUMMARY"
